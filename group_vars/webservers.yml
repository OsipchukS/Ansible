---
packages_list:
  - ca-certificates
  - curl
  - git
  - vim
  - htop
  - unzip

# Fresh Ubuntu Server 24.04 deployment using Docker Compose and HTTP by IP.
wordpress_project_name: wordpress
wordpress_project_path: /opt/wordpress
wordpress_public_host: "{{ ansible_host | default(inventory_hostname) }}"
wordpress_http_port: 80
wordpress_site_url: "http://{{ wordpress_public_host }}{{ ':' ~ (wordpress_http_port | string) if wordpress_http_port | int != 80 else '' }}"

# Images are pulled only when missing. Review upgrades and back up volumes first.
wordpress_image: wordpress:7.1.4-php8.3-apache
wordpress_cli_image: wordpress:cli-2.12.0-php8.3
wordpress_db_image: mariadb:11.4

# Administrator settings apply only during the initial installation.
wordpress_admin_email: admin@example.com
wordpress_admin_user: wordpressadmin
wordpress_site_title: WordPress Site

# Database settings initialize the database volume only once.
wordpress_db_name: wordpress
wordpress_db_user: wordpress

# Ansible Vault encrypted WordPress passwords. Provide the Vault password at
# runtime with --ask-vault-pass; the Vault password is stored outside the
# repository. See README.md for the encrypt_string commands.
